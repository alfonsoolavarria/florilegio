{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Florilegio de la Fe{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Florilegio de la Fe es un sitio web para profundizar en la intimidad con Dios a través de artículos de teología, historia y biografías.{% endblock %}">
    <meta name="keywords" content="{% block meta_keywords %}teología, fe, cristianos, Dios, evangelio, palabra de Dios, biblia, estudio bíblico, historia de la iglesia, biografías cristianas{% endblock %}">
    <meta name="theme-color" content="#2757fd">

    {% block canonical %}{% endblock %}
    <link rel="shortcut icon" href="{% static 'images/ff.ico' %}" type="image/x-icon">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Open Graph Tags -->
    <meta property="og:locale" content="es_ES">
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:title" content="{% block og_title %}Florilegio de la Fe{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Profundizando en la intimidad con Dios. Artículos, ensayos y biografías.{% endblock %}">
    <meta property="og:site_name" content="Florilegio de la Fe">
    <meta property="og:image" content="{% block og_image %}{% static 'images/ff.jpg' %}{% endblock %}">
    <meta property="og:url" content="{% block og_url %}{{ request.build_absolute_uri }}{% endblock %}">

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="{% block twitter_card %}summary_large_image{% endblock %}">
    <meta name="twitter:title" content="{% block twitter_title %}Florilegio de la Fe{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Profundizando en la intimidad con Dios. Artículos, ensayos y biografías.{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}{% static 'images/ff.jpg' %}{% endblock %}">

    <!-- preload head styles -->
    <link rel="preload" href="{% static 'css/unicons.min.css' %}" as="style">
    <link rel="preload" href="{% static 'css/swiper-bundle.min.css' %}" as="style">

    <!-- preload footer scripts -->
    <link rel="preload" href="{% static 'js/jquery.min.js' %}" as="script">
    <link rel="preload" href="{% static 'js/scrollmagic.min.js' %}" as="script">
    <link rel="preload" href="{% static 'js/swiper-bundle.min.js' %}" as="script">
    <link rel="preload" href="{% static 'js/anime.min.js' %}" as="script">
    <link rel="preload" href="{% static 'js/data-attr-helper.js' %}" as="script">
    <link rel="preload" href="{% static 'js/swiper-helper.js' %}" as="script">
    <link rel="preload" href="{% static 'js/anime-helper.js' %}" as="script">
    <link rel="preload" href="{% static 'js/anime-helper-defined-timelines.js' %}" as="script">
    <link rel="preload" href="{% static 'js/uikit-components-bs.js' %}" as="script">
    <link rel="preload" href="{% static 'js/app.js' %}" as="script">

    <!-- app head for bootstrap core -->
    <script src="{% static 'js/app-head-bs.js' %}"></script>

    <!-- include uni-core components -->
    <link rel="stylesheet" href="{% static 'css/uni-core.min.css' %}">

    <!-- include styles -->
    <link rel="stylesheet" href="{% static 'css/unicons.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/prettify.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/swiper-bundle.min.css' %}">

    <!-- include main style -->
    <link rel="stylesheet" href="{% static 'css/demo-four.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">

    <!-- CKEditor 5 Rich Text Editor (custom build) -->
    <script src="{% static 'js/ckeditor.js' %}"></script>
    <!-- PDF Export Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- include scripts -->
    <script src="{% static 'js/uni-core-bundle.min.js' %}"></script>

    <!-- WebP Detection -->
    <script>
        (function() {
            var html = document.documentElement;
            var img = new Image();
            img.onload = function() { html.className += ' webp'; };
            img.onerror = function() { html.className += ' no-webp'; };
            img.src = 'data:image/webp;base64,UklGRi4AAABXRUJQVlA4TCEAAAAvAUAAEB8wAiMwAgSSNtse/cXjxyCCmrYNWPwmHRsB7wEAAAA=';
        })();
    </script>

    {% block extra_head %}{% endblock %}

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Florilegio de la Fe",
      "url": "https://florilegiodelafe.com",
      "logo": "https://florilegiodelafe.com/static/images/ff.jpg",
      "description": "Profundizando en la intimidad con Dios a través de artículos de teología, historia de la iglesia y biografías cristianas.",
      "sameAs": [
        "https://facebook.com/florilegiodelafe",
        "https://instagram.com/florilegiodelafe",
        "https://youtube.com/@florilegiodelafe"
      ]
    }
    </script>
</head>

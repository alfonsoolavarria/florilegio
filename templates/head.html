{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Florilegio de la Fe{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Florilegio de la Fe es un sitio web para profundizar en la intimidad con Dios a través de artículos de teología, historia y biografías.{% endblock %}">
    <meta name="keywords" content="{% block meta_keywords %}teología, fe, cristianos, Dios, evangelio, palabra de Dios, biblia, estudio bíblico, historia de la iglesia, biografías cristianas{% endblock %}">
    <meta name="theme-color" content="#f7f3ed">

    <!-- PWA -->
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <link rel="apple-touch-icon" href="{% static 'images/icons/apple-touch-icon.png' %}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Florilegio">
    <meta name="application-name" content="Florilegio">

    <!-- Pantallas de arranque iOS (evitan el flash blanco al abrir la app) -->
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="{% static 'images/splash/splash-750x1334.png' %}">
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="{% static 'images/splash/splash-828x1792.png' %}">
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="{% static 'images/splash/splash-1125x2436.png' %}">
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" href="{% static 'images/splash/splash-1242x2688.png' %}">
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="{% static 'images/splash/splash-1170x2532.png' %}">
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="{% static 'images/splash/splash-1179x2556.png' %}">
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="{% static 'images/splash/splash-1284x2778.png' %}">
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="{% static 'images/splash/splash-1290x2796.png' %}">
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3)" href="{% static 'images/splash/splash-1206x2622.png' %}">
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)" href="{% static 'images/splash/splash-1320x2868.png' %}">

    {% block canonical %}{% endblock %}
    <link rel="shortcut icon" href="{% static 'images/ff.ico' %}" type="image/x-icon">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">

    <!-- Tema elegido (Clásico/Joven) antes de pintar, sin parpadeo -->
    <script>try{if(localStorage.getItem('fm-theme')==='joven'){document.documentElement.classList.add('fm-joven')}}catch(e){}</script>

    <!-- Open Graph Tags -->
    <meta property="og:locale" content="es_ES">
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:title" content="{% block og_title %}Florilegio de la Fe{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Profundizando en la intimidad con Dios. Artículos, ensayos y biografías.{% endblock %}">
    <meta property="og:site_name" content="Florilegio de la Fe">
    <meta property="og:image" content="{% block og_image %}{% static 'images/ff.jpg' %}{% endblock %}">
    <meta property="og:url" content="{% block og_url %}{{ request.build_absolute_uri }}{% endblock %}">

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="{% block twitter_card %}summary_large_image{% endblock %}">
    <meta name="twitter:title" content="{% block twitter_title %}Florilegio de la Fe{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Profundizando en la intimidad con Dios. Artículos, ensayos y biografías.{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}{% static 'images/ff.jpg' %}{% endblock %}">

    <!-- DNS Prefetch / Preconnect for third-party origins -->
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://www.paypal.com" crossorigin>

    <!-- app head for bootstrap core -->
    <script defer src="{% static 'js/app-head-bs.js' %}"></script>

    <!-- include uni-core components -->
    <link rel="stylesheet" href="{% static 'css/uni-core.min.css' %}">

    <!-- include styles -->
    <link rel="stylesheet" href="{% static 'css/unicons.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/swiper-bundle.min.css' %}">

    <!-- include main style -->
    <link rel="stylesheet" href="{% static 'css/demo-four.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    <link rel="stylesheet" href="{% static 'css/mobile.css' %}">
    <link rel="stylesheet" href="{% static 'css/theme-joven.css' %}">

    <!-- include scripts -->
    <script src="{% static 'js/uni-core-bundle.min.js' %}"></script>

    <!-- WebP Detection -->
    <script>
        (function() {
            var html = document.documentElement;
            var img = new Image();
            img.onload = function() { html.className += ' webp'; };
            img.onerror = function() { html.className += ' no-webp'; };
            img.src = 'data:image/webp;base64,UklGRi4AAABXRUJQVlA4TCEAAAAvAUAAEB8wAiMwAgSSNtse/cXjxyCCmrYNWPwmHRsB7wEAAAA=';
        })();
    </script>

    {% block extra_head %}{% endblock %}

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Florilegio de la Fe",
      "url": "https://florilegiodelafe.com",
      "logo": "https://florilegiodelafe.com/static/images/ff.jpg",
      "description": "Profundizando en la intimidad con Dios a través de artículos de teología, historia de la iglesia y biografías cristianas.",
      "sameAs": [
        "https://facebook.com/florilegiodelafe",
        "https://instagram.com/florilegiodelafe",
        "https://youtube.com/@florilegiodelafe"
      ]
    }
    </script>
</head>
